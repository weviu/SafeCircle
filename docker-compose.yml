services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  ntfy:
    # Self-hosted push. Pinned to an exact version (no latest). Published via
    # the internal network only — reachable from outside through Nginx's
    # /ntfy/ location (no host port is published). --behind-proxy makes it
    # trust X-Forwarded-For from nginx.
    image: binwiederhier/ntfy:v2.28.0
    command: serve --behind-proxy
    environment:
      # Match NTFY_BASE_URL / nginx proxy target (ntfy's default port is 80).
      NTFY_LISTEN_HTTP: ":2586"
    volumes:
      - ntfy_data:/var/lib/ntfy
    restart: unless-stopped

  postgres:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - ntfy

volumes:
  pgdata:
  ntfy_data:
